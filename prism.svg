    <path d="M150 118 L242 78"  stroke="#ef4444" stroke-width="9"/>
    <path d="M152 128 L246 106" stroke="#f97316" stroke-width="9"/>
    <path d="M153 138 L248 134" stroke="#eab308" stroke-width="9"/>
    <path d="M152 148 L246 162" stroke="#22c55e" stroke-width="9"/>
    <path d="M150 158 L242 190" stroke="#3b82f6" stroke-width="9"/>
