---
name: AppImage
permissions: {}

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      native: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect documentation-only changes
        id: changes
        run: python3 scripts/ci-needs-build.py

      - name: Checkout Linux build dependencies
        if: steps.changes.outputs.build == 'true'
        run: bash scripts/checkout-linux-submodules.sh
      - name: Test installer and integration
        if: steps.changes.outputs.build == 'true'
        run: python3 tests/integration/test_appimage.py
      - name: Restore compiler and npm caches
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ccache-appimage
            ~/.npm
          key: appimage-build-v1-${{ runner.arch }}-${{ github.sha }}
          restore-keys: appimage-build-v1-${{ runner.arch }}-
      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - name: Build baseline container
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: packaging/linux/AppImage/Dockerfile
          load: true
          tags: prism-appimage-build
          cache-from: type=gha,scope=prism-appimage-builder
          cache-to: type=gha,scope=prism-appimage-builder,mode=max
      - name: Build and test AppImage
        if: steps.changes.outputs.build == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          COMMIT: ${{ github.sha }}
        run: >-
          docker run --rm
          -e BRANCH -e BUILD_VERSION -e COMMIT
          -e PRISM_BUILD_JOBS="$(nproc)"
          -e CMAKE_C_COMPILER_LAUNCHER=ccache
          -e CMAKE_CXX_COMPILER_LAUNCHER=ccache
          -e CMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1G -e CCACHE_COMPILERCHECK=content
          -v "${{ runner.temp }}/ccache-appimage:/ccache"
          -v "$HOME/.npm:/root/.npm"
          -v "$PWD:/src"
          prism-appimage-build
          bash -ec 'trap "ccache --show-stats" EXIT;
          bash tests/integration/test_appimage_build_ownership.sh /src;
          bash tests/integration/test_cached_compositor.sh /src;
          bash scripts/build-appimage.sh'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.changes.outputs.build == 'true'
        with:
          name: prism-appimage-x86_64
          compression-level: 0
          path: cmake-build-appimage/artifacts/*
          if-no-files-found: error

  compatibility:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:44"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.build.outputs.native == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        if: needs.build.outputs.native == 'true'
        with:
          name: prism-appimage-x86_64
          path: artifact
      - name: Install host desktop libraries
        if: needs.build.outputs.native == 'true'
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y file libgl1 libegl1 libgbm1 libvulkan1 libasound2t64 \
              libpipewire-0.3-0t64 fontconfig-config \
              libpulse0 libnss3 libxkbcommon0 libx11-6 libxcb1 libxext6 \
              libxrandr2 libxfixes3 libxdamage1 libxcomposite1 libxcursor1 \
              libxi6 libxtst6 libxrender1 libsm6 libice6 libdrm2 libwayland-client0
          else
            dnf install -y file mesa-libGL mesa-libEGL mesa-libgbm vulkan-loader \
              pipewire-libs fontconfig \
              alsa-lib pulseaudio-libs nss libxkbcommon libX11 libxcb libXext \
              libXrandr libXfixes libXdamage libXcomposite libXcursor libXi \
              libXtst libXrender libSM libICE libdrm libwayland-client
          fi
      - name: Verify portable payload without FUSE
        if: needs.build.outputs.native == 'true'
        shell: bash
        run: |
          cd artifact
          sha256sum --check prism-x86_64.AppImage.sha256
          chmod +x prism-x86_64.AppImage
          ./prism-x86_64.AppImage --appimage-extract >/dev/null
          bash ../scripts/check-appimage.sh squashfs-root


  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'atgehrhardt/prism'
    needs: [build, compatibility]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: prism-appimage-x86_64
          path: artifact
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifact/*
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifact/* \
              --verify-tag --generate-notes "${flags[@]}"
          fi
