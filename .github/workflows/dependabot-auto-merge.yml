---
name: Dependabot auto-merge
permissions: {}

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  push:
    branches: [master]
  workflow_run:
    workflows: [Linux, Common Lint]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.repository == 'atgehrhardt/prism' &&
      (github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Only execute trusted master code with write permissions, never PR contents.
      - name: Checkout automation from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Refresh and enroll open Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/dependabot-auto-merge.py
