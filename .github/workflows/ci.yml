---
name: Linux
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHON_VERSION: "3.14"
      CCACHE_DIR: ${{ github.workspace }}/cmake-build-ccache-linux
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect documentation-only changes
        id: changes
        run: python3 scripts/ci-needs-build.py

      - name: Checkout Linux build dependencies
        if: steps.changes.outputs.build == 'true'
        run: bash scripts/checkout-linux-submodules.sh

      - name: Restore compiler and npm caches
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.npm
          key: linux-build-v1-${{ runner.arch }}-${{ github.sha }}
          restore-keys: linux-build-v1-${{ runner.arch }}-

      - name: Install build dependencies
        if: steps.changes.outputs.build == 'true'
        run: |
          ./scripts/linux_build.sh --step=deps --skip-cuda --ubuntu-test-repo
          sudo apt-get install -y --no-install-recommends ccache

      - name: Test CI build optimizations
        if: steps.changes.outputs.build == 'true'
        run: python3 tests/integration/test_ci_build.py

      - name: Set up Python
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test Linux capture selection
        if: steps.changes.outputs.build == 'true'
        run: python3 tests/integration/test_capture_selection.py

      - name: Set up uv
        if: steps.changes.outputs.build == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Sync coverage tools
        if: steps.changes.outputs.build == 'true'
        run: >-
          uv sync
          --project tools/coverage
          --locked
          --python "${PYTHON_VERSION}"
          --no-python-downloads
          --no-install-project

      - name: Configure
        if: steps.changes.outputs.build == 'true'
        run: |
          cmake \
            -S . \
            -B cmake-build-ci \
            -G Ninja \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_WERROR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DPRISM_ENABLE_CUDA=OFF

      - name: Build
        if: steps.changes.outputs.build == 'true'
        id: build
        run: |
          cmake --build cmake-build-ci --parallel "$(nproc)"
          ccache --show-stats

      - name: Run tests
        if: steps.changes.outputs.build == 'true'
        id: test
        working-directory: cmake-build-ci/tests
        run: >-
          xvfb-run
          --auto-servernum
          ./test_prism
          --gtest_color=yes
          --gtest_output=xml:test-results.xml

      - name: Generate coverage report
        if: >-
          always() && steps.changes.outputs.build == 'true' &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        run: |
          uv run --project tools/coverage --locked --no-sync gcovr \
            cmake-build-ci \
            --root src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --gcov-executable "gcov-${GCC_VERSION}" \
            --xml-pretty \
            --output cmake-build-ci/coverage.xml

      - name: Upload test artifacts
        if: always() && steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-test-results
          path: |
            cmake-build-ci/coverage.xml
            cmake-build-ci/tests/test-results.xml
            cmake-build-ci/tests/test_prism.log
          if-no-files-found: warn
          retention-days: 14
